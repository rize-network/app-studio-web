<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Build React and React Native interfaces with typed style props, responsive layouts, theme tokens, and animations. Discover the App Studio styling engine." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob:;" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Self-hosted brand font; the system fallback renders without waiting. -->
  <!-- DNS prefetch for CDN domains to reduce connection latency -->
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <style>
    @font-face {
      font-family: 'Mulish';
      font-style: normal;
      font-weight: 400 800;
      font-display: optional;
      src: url('/fonts/mulish-subset.woff2') format('woff2');
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      min-height: 100%;
      background: #FAFAFA;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    td {
      min-width: 200px;
    }

    input,
    button,
    textarea,
    select {
      font: inherit;
      -webkit-font-smoothing: inherit;
    }

    /* Inline critical loading styles to avoid layout shift */
    #root {
      min-height: 100vh;
    }
  </style>
  <title>App Studio — Your styles. Your components. One API.</title>
</head>

<body>
  <noscript>Enable JavaScript for interactive examples and component documentation.</noscript>
  <!-- Public pages are prerendered at build time and hydrated on mount. -->
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
